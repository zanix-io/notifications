# .github/workflows/ci.yml

name: CI

on:
  # Run on push or PRs to main branch. `publish.yml` starts from this workflow's own completed run
  # on `master` (`workflow_run`), so a push runs these checks once and publish waits for them.
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions:
      contents: read # Allows reading of the repository's contents.

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      # A real, unauthenticated SMTP catcher for `smtp-catcher.test.ts` — proves `SmtpConnection`
      # actually round-trips a real socket (dial, EHLO, no advertised AUTH/STARTTLS, delivery),
      # not just a mocked `Deno.Conn`. Exposes SMTP on 1025 and its own HTTP API on 8025.
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Check for circular-import hazards
        run: deno run --no-config --min-dep-age=0 -A jsr:@zanix/cli check-cycles

      - name: Check for duplicate '@zanix/*' dependencies
        run: deno run --no-config --min-dep-age=0 -A jsr:@zanix/cli check-duplicates

      - name: Run Deno task build
        run: deno task build-handlebars

      - name: Run tests
        run: deno test --allow-all
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
          SMTP_CATCHER_HOST: localhost
          SMTP_CATCHER_PORT: 1025
          SMTP_CATCHER_API: http://localhost:8025
